name: Quality Checks & Live Demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, report, and package site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install packages
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit, API, and UI tests
        run: npm test

      - name: Upload downloadable Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Package recruiter-facing site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p site
          cp -R src/public/. site/
          rm -rf site/test-report
          cp -R playwright-report site/test-report
          touch site/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy live demo
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
